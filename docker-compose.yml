#THIS IS OUTDATED SINCE I'VE CHANGED A LOT FOR THE KUBERNETES YAML.
version: "3.8"
services:
  app:
    build: ./Frontend
    image: toartistfrontend
    ports:
      - 5173:5173
    volumes:
      - ./Frontend/src:/app/src
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      TEXTSTORE_HOST: textstore
      WORKER: worker
      TIMEOUT: 10

  worker:
    build: ./worker-service
    image: workerservice
    ports:
      - "8080:3000"
    volumes:
      - ./Worker-Service/src:/app/src
    deploy:
      replicas: 1
    environment:
      TEXTSTORE_HOST: textstore
    depends_on:
    - textstore

  userworker:
    build: ./user-service
    image: userservice
    ports:
      - "8081:3001"
    volumes:
      - ./user-service/src:/app/src
    deploy:
      replicas: 1
    environment:
      TEXTSTORE_HOST: textstore
    depends_on:
    - textstore

  textstore:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toartistdb

    expose:
      - "5432"
    volumes:
      - textstore-data:/var/lib/postgresql/data

  loadbalancer:
     image: nginx:latest
     volumes:
       - ./Containers/nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
     depends_on:
       - app
     ports:
       - "8080:3000"
     networks:
      default:
        driver: bridge
        name: app

volumes:
  textstore-data: